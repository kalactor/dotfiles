[templates]
# Shell
starship.template = 'starship-colors.toml'
starship.target = '~/.config/starship.toml'

waybar.template = 'waybar-colors.css'
waybar.target = '~/.config/waybar/colors.css'

swaync.template = 'swaync-colors.css'
swaync.target = '~/.config/swaync/colors.css'

# Window manager
hypr.template = 'hypr-colors.lua'
hypr.target = '~/.config/hypr/colors.lua'

hyprlock.template = 'hyprlock-colors.conf'
hyprlock.target = '~/.config/hypr/hyprlock-colors.conf'

# Apps
kitty.template = 'kitty-colors.conf'
kitty.target = '~/.config/kitty/colors.conf'

rofi.template = 'rofi-colors.rasi'
rofi.target = '~/.config/rofi/colors.rasi'

gtk3.template = 'gtk-colors.css'
gtk3.target = '~/.config/gtk-3.0/gtk.css'

gtk4.template = 'gtk-colors.css'
gtk4.target = '~/.config/gtk-4.0/gtk.css'

vim.template = 'vim-colors.vim'
vim.target = '~/.vim/colors/wallust.vim'

wlogout.template = 'wlogout-colors.css'
wlogout.target = '~/.config/wlogout/colors.css'
