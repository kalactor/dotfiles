# Generated by wallust + rice-contrast — do not edit by hand.
# Starship prompt, recolored with every wallpaper change.
"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
command_timeout = 1000
palette = "wallust"

format = """
[╭─](fg:muted)$directory$git_branch$git_status$cmd_duration
[╰─](fg:muted)$character """

[palettes.wallust]
bg     = "{{ background }}"
fg     = "{{ foreground }}"
muted  = "{{ muted }}"
accent = "{{ accent }}"
blue   = "{{ link }}"
green  = "{{ success }}"
red    = "{{ danger }}"
yellow = "{{ warning }}"

[directory]
style = "bold fg:accent"
format = "[$path]($style)"
truncation_length = 4
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "docs"
"Downloads" = "dl"
"Pictures" = "pics"

[git_branch]
symbol = " "
style = "fg:blue"
format = "[$symbol$branch]($style)"

[git_status]
style = "fg:red"
format = "([$all_status$ahead_behind]($style))"

[cmd_duration]
min_time = 2000
style = "fg:muted"
format = " [$duration]($style)"

[character]
success_symbol = "[❯](bold fg:accent)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:blue)"
