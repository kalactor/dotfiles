# mpv — GPU-next playback tuned for a desktop NVIDIA setup
vo=gpu-next
hwdec=auto-safe
profile=high-quality

# Resume and window behaviour
save-position-on-quit=yes
keep-open=yes
osc=yes

# Subtitles
sub-font="Inter"
sub-font-size=42
sub-border-size=2.5
sub-shadow-offset=1

# Audio
volume=100
volume-max=150

# Screenshots
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots

# Streams (only used when yt-dlp is installed)
ytdl-format=bestvideo*+bestaudio/best
