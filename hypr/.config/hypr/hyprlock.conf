source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

background {
    monitor =
    # Follow the current light/dark wallpaper instead of capturing whatever
    # window happened to be open when the screen locked.
    path = ~/.cache/rice/wallpaper
    color = $background
    blur_passes = 3
    blur_size = 6
    # 0.90 in light mode keeps dark text readable; 0.55 darkens night
    # wallpapers so light text stays readable.
    brightness = $scrim
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $clock
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $muted
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}

# Password box
input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $foreground
    inner_color = $background
    font_color = $foreground
    # Semantic colors are fixed so they stay visible against both palettes.
    check_color = rgba(7FC97FFF)
    fail_color = rgba(FF5F5FFF)
    capslock_color = rgba(E5C07BFF)
    # Keep the field visible when empty so the lock screen looks complete.
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    position = 0, -40
    halign = center
    valign = center
}
