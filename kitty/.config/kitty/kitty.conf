# kitty config -> ~/.config/kitty/kitty.conf
# Colors come from wallust via colors.conf (see the bottom of this file).

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# Look
window_padding_width     25
background_opacity       0.78
dynamic_background_opacity yes
cursor_shape             beam
cursor_beam_thickness    1.5
cursor_blink_interval    0
confirm_os_window_close  0
hide_window_decorations  yes
remember_window_size     no
initial_window_width     1100
initial_window_height    650

# Tabs (minimal, powerline-less)
tab_bar_style            fade
tab_fade                 0.25 0.5 0.75 1
tab_bar_min_tabs         2
active_tab_font_style    bold
inactive_tab_font_style  normal

# Behaviour
scrollback_lines         10000
copy_on_select           clipboard
enable_audio_bell        no
mouse_hide_wait          2.0
shell                    zsh
allow_remote_control     yes
listen_on                unix:/tmp/kitty-{kitty_pid}

# Keys
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+f search_scrollback
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Colours: generated by wallust (theme-apply / wall). Keep this include last.
include ~/.config/kitty/colors.conf
