# Caelestia-flavoured kitty config -> ~/.config/kitty/kitty.conf

# Font (same family the Caelestia shell uses for mono)
font_family      CaskaydiaCove NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# Look
window_padding_width     10
background_opacity       0.85
dynamic_background_opacity yes
cursor_shape             beam
cursor_blink_interval    0
confirm_os_window_close  0
hide_window_decorations  yes
remember_window_size     no
initial_window_width     1100
initial_window_height    650

# Tabs (minimal, powerline-less)
tab_bar_style            fade
tab_fade                 0.25 0.5 0.75 1
tab_bar_min_tabs         2
active_tab_font_style    bold
inactive_tab_font_style  normal

# Behaviour
scrollback_lines         10000
copy_on_select           clipboard
enable_audio_bell        no
mouse_hide_wait          2.0
shell                    bash
allow_remote_control     yes
listen_on                unix:/tmp/kitty-{kitty_pid}

# Keys
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Colours: loaded from the Caelestia scheme if present (optional)
# include ~/.config/kitty/caelestia-colors.conf

# Fallback palette (Material-You-ish dark) in case you don't use caelestia-cli
foreground              #e3e1e9
background              #121318
selection_foreground    #121318
selection_background    #b9c3ff
cursor                  #b9c3ff
color0  #1b1b21
color8  #46464f
color1  #ffb4ab
color9  #ffdad6
color2  #a8d5a0
color10 #c3f0bb
color3  #e5c07b
color11 #f2d9a0
color4  #b9c3ff
color12 #dde1ff
color5  #e0b8f0
color13 #f4d9ff
color6  #8fd5e8
color14 #b6ecff
color7  #c7c5d0
color15 #e3e1e9
