[Settings]
# Theme, icon theme, and light/dark preference come from gsettings through the
# XDG settings portal; theme-apply updates them. Do not pin them here: a stale
# Adwaita-dark/Papirus-Dark or prefer-dark value leaks into light mode for
# apps that read settings.ini directly.
gtk-font-name=Inter 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-enable-animations=1
